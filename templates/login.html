<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — DevTrack</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="landing">

    <header class="navbar">
        <div class="container navbar-inner">
            <a href="{{ url_for('index') }}" class="brand">
                <span class="brand-logo">&#128640;</span>
                <span class="brand-name">DevTrack</span>
            </a>
            <a href="{{ url_for('auth.register') }}" class="btn btn-primary btn-sm">Create account</a>
        </div>
    </header>

    <div class="auth-wrap">
        <div class="card auth-card">
            <h1>Welcome back</h1>
            <p class="page-sub">Log in to continue your streak.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="toast {{ category }}" style="margin-bottom: 14px;">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="post" action="{{ url_for('auth.login') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" class="input" id="username" name="username" maxlength="50" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" class="input" id="password" name="password" maxlength="128" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>

            <p class="auth-alt">No account yet? <a href="{{ url_for('auth.register') }}">Register</a></p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
